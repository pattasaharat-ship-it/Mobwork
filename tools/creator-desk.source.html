<title>โต๊ะงานสายเที่ยว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: SaaS shell. Desktop = fixed sidebar + content column; mobile = top bar + bottom tab bar + "more" drawer. Ink-teal identity, mango accent used only for primary actions. */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --surface-2:#eef2f1; --surface-3:#e3e9e7; --line:#dbe3e1; --line-strong:#c4d0cd;
  --fg:#14272a; --fg-2:#3c5156; --muted:#6a7f83;
  --ink:#16343a; --ink-fg:#e9f2f1; --ink-muted:#93aeb0; --ink-hover:#20454c;
  --accent:#e3a21a; --accent-fg:#2b1d00; --accent-soft:#fbf1da;
  --link:#1f6f8b;
  --good:#1b8457; --good-bg:#e3f4ec; --warn:#a96a06; --warn-bg:#fcf0d9; --bad:#c03d2c; --bad-bg:#fbe6e2; --info:#2465a8; --info-bg:#e3eefa; --neutral-bg:#eceff0;
  --c-sky:#2f7fc1; --c-green:#2e9a6a; --c-orange:#d4572a; --c-violet:#7a5fc0; --c-rose:#c43d72; --c-amber:#b88400; --c-teal:#16827f; --c-slate:#5f6f7a;
  --shadow:0 1px 2px rgb(16 40 44 / .06),0 4px 16px rgb(16 40 44 / .06);
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1719; --surface:#152124; --surface-2:#1b2a2d; --surface-3:#233538; --line:#26383b; --line-strong:#34494d;
  --fg:#e6eeee; --fg-2:#bccbcc; --muted:#8aa0a2;
  --ink:#0b1416; --ink-fg:#dfeaea; --ink-muted:#7f9799; --ink-hover:#172628;
  --accent:#f0b234; --accent-fg:#2b1d00; --accent-soft:#3a2f15; --link:#6cc0dc;
  --good:#4cc08a; --good-bg:#16352a; --warn:#e8ac45; --warn-bg:#3a2e14; --bad:#f07a66; --bad-bg:#3d1f1a; --info:#77b0ee; --info-bg:#182c44; --neutral-bg:#243336;
  --c-sky:#5aa6e6; --c-green:#53c08e; --c-orange:#f07d4f; --c-violet:#a891ea; --c-rose:#ec6f9e; --c-amber:#e0b23c; --c-teal:#43bcb6; --c-slate:#93a4ae;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 4px 16px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1719; --surface:#152124; --surface-2:#1b2a2d; --surface-3:#233538; --line:#26383b; --line-strong:#34494d;
  --fg:#e6eeee; --fg-2:#bccbcc; --muted:#8aa0a2;
  --ink:#0b1416; --ink-fg:#dfeaea; --ink-muted:#7f9799; --ink-hover:#172628;
  --accent:#f0b234; --accent-fg:#2b1d00; --accent-soft:#3a2f15; --link:#6cc0dc;
  --good:#4cc08a; --good-bg:#16352a; --warn:#e8ac45; --warn-bg:#3a2e14; --bad:#f07a66; --bad-bg:#3d1f1a; --info:#77b0ee; --info-bg:#182c44; --neutral-bg:#243336;
  --c-sky:#5aa6e6; --c-green:#53c08e; --c-orange:#f07d4f; --c-violet:#a891ea; --c-rose:#ec6f9e; --c-amber:#e0b23c; --c-teal:#43bcb6; --c-slate:#93a4ae;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 4px 16px rgb(0 0 0 / .25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--ink);color:var(--ink-fg);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.side .biz{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.side .biz b{font-size:1.02rem;font-weight:600;line-height:1.3}
.side .biz span{font-size:.78rem;color:var(--ink-muted)}
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink-fg);padding:8px 10px;border-radius:8px;text-align:left;width:100%;font-size:.92rem;opacity:.86}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--ink-hover);opacity:1}
.nav-item[aria-current="page"]{background:var(--ink-hover);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .count{margin-left:auto;font-size:.72rem;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px;font-weight:600}
.nav-soon{display:flex;align-items:center;gap:10px;padding:7px 10px;color:var(--ink-muted);font-size:.86rem}
.nav-soon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav-soon em{margin-left:auto;white-space:nowrap;flex:none;font-style:normal;font-size:.68rem;border:1px solid var(--ink-muted);border-radius:999px;padding:0 6px}
.side .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:14px 10px 4px}
.side .me{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--ink-hover);display:flex;align-items:center;gap:10px;font-size:.84rem}
.side .me img{width:28px;height:28px;border-radius:50%}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{width:100%;max-width:1280px;margin:0 auto;padding-inline:28px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.mnav{display:none}

/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:1.5rem;font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumb button{border:0;background:none;color:var(--link);padding:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:7px 13px;font-weight:500;font-size:.9rem;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* cards & kpi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h h2{font-size:.98rem;font-weight:600;margin:0}
.card-h .sub{font-size:.8rem;color:var(--muted)}
.card-b{padding:0 16px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.45rem;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:.76rem;color:var(--muted)}
.kpi.hl{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.kpi.hl .l,.kpi.hl .h{color:var(--ink-muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
button.stat:hover{border-color:var(--line-strong)}
.stat .v{font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:28px}
.stat .l{font-size:.8rem;color:var(--fg-2);line-height:1.35}
.stat.alert .v{color:var(--bad)}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li .m{flex:1;min-width:0}
.li .t{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{flex:none;text-align:right;font-size:.85rem}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--muted));display:inline-block}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--good);border-color:var(--good)}
.check.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--fg-2);font-weight:600}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:500;padding:1px 9px;border-radius:999px;white-space:nowrap;line-height:1.6;background:var(--neutral-bg);color:var(--fg-2)}
.badge.good{background:var(--good-bg);color:var(--good)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)}
.badge.accent{background:var(--accent-soft);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:1px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap;color:var(--fg-2)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

/* toolbar & filters */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 220px;min-width:0;max-width:340px}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.sel{padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);max-width:200px;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:5px 12px;font-size:.86rem;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl th button{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center}
.tbl th button:hover{color:var(--fg)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl .t1{font-weight:500}
.tbl .t2{font-size:.78rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.pager .b{display:flex;gap:6px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kcol{flex:0 0 260px;background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kcol.over{outline:2px dashed var(--accent)}
.kcol h3{margin:0;font-size:.84rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left;width:100%}
.kcard:hover{border-color:var(--line-strong)}
.kcard .t{font-weight:500;line-height:1.35}
.kcard .s{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .wd{font-size:.76rem;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.other{background:var(--surface-2)}
.cal .day .d{font-size:.78rem;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.cal .day.today .d{color:var(--accent-fg);background:var(--accent);border-radius:999px;align-self:flex-start;padding:0 7px;font-weight:600}
.ev{display:block;width:100%;border:0;text-align:left;font-size:.74rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--fg);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.more{font-size:.72rem;color:var(--muted);padding:0 6px}
.cal .day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .day button.d{border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-size:.78rem;padding:0 4px;align-self:flex-start;border-radius:999px}
.cal .day.today button.d{color:var(--accent-fg);background:var(--accent);padding:0 7px;font-weight:600}
.cal button.more{border:0;background:none;text-align:left;cursor:pointer}
.li .tm{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:600;font-size:.86rem;display:flex;flex-direction:column;line-height:1.25}
.li .tm small{font-weight:400;color:var(--muted);font-size:.74rem}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:220px;min-width:0}
.wcol.today{border-color:var(--accent)}
.wh{border:0;background:none;display:flex;gap:6px;align-items:baseline;padding:2px 4px;border-radius:6px;text-align:left}
.wh:hover{background:var(--surface-2)} .wh span{color:var(--muted);font-size:.8rem} .wh b{font-size:1.1rem}
.wcol.today .wh b{color:var(--warn)}
.wev{border:0;text-align:left;font-size:.78rem;padding:5px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:3px solid var(--c);color:var(--fg);overflow-wrap:anywhere;line-height:1.35}
.wev .wt{display:block;font-weight:600;font-size:.72rem;color:var(--fg-2)}
.wadd{margin-top:auto;border:1px dashed var(--line-strong);background:none;border-radius:6px;padding:3px;color:var(--muted);display:grid;place-items:center}
.wadd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
@media (max-width:960px){.week{grid-template-columns:minmax(0,1fr)}.wcol{min-height:0}}
.mini-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:.8rem}
.mini-cal .wd{color:var(--muted);font-size:.72rem;padding:2px 0}
.mini-cal .c{padding:5px 0 3px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.mini-cal .c.o{opacity:.35}
.mini-cal .c.t{background:var(--accent-soft);font-weight:600}
.mini-cal .c i{display:flex;gap:2px;height:5px}
.mini-cal .c i b{width:5px;height:5px;border-radius:50%;background:var(--c)}

/* detail */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 20px;padding:4px 16px 16px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:.76rem;color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 16px 16px;color:var(--fg-2)}
.timeline{display:flex;flex-direction:column}
.timeline .it{display:flex;gap:10px;padding:8px 16px;font-size:.86rem;align-items:flex-start}
.timeline .it .when{flex:none;width:92px;color:var(--muted);font-size:.78rem;padding-top:1px}
.timeline .it .what{min-width:0;overflow-wrap:anywhere;flex:1}
.money-row{display:flex;justify-content:space-between;padding:6px 16px;font-size:.9rem;gap:10px}
.money-row.total{border-top:1px solid var(--line);font-weight:600;padding-top:10px}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.logform{display:grid;grid-template-columns:130px 150px minmax(0,1fr) auto;gap:8px;align-items:end}
.payform{display:grid;grid-template-columns:130px 120px minmax(0,1fr) auto;gap:8px;align-items:end}

/* forms & modal */
.scrim{position:fixed;inset:0;background:rgb(8 20 22 / .45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgb(0 0 0 / .3);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:1.08rem;font-weight:600}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal-f .r{display:flex;gap:8px;margin-left:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mstats div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mstats span{font-size:.74rem;color:var(--muted)}.mstats b{font-size:1.08rem;font-variant-numeric:tabular-nums}

        }, err => { S.error = "โหลดข้อมูลไม่สำเร็จ (" + (err?.code || "unknown") + ") ลองรีเฟรชหน้า"; S.loaded.add(col); render(); });
      }
      c.use("user").then(async u => { if (u) { S.me = await u.me(); render(); } }).catch(()=>{});
    } else {
      S.mode = "local";
      try { const saved = JSON.parse(localStorage.getItem("cbp-data") || "null"); if (saved) for (const k of COLS) if (Array.isArray(saved[k])) D[k] = saved[k]; } catch {}
      COLS.forEach(c => S.loaded.add(c)); render();
    }
    c?.use?.("downloads").then(d => { this.dl = d; }).catch(()=>{});
  },
  persist() { try { localStorage.setItem("cbp-data", JSON.stringify(D)); } catch {} },
  async save(col, id, data, logText) {
    id = id || newId();
    const body = {...data, updatedAt:new Date().toISOString()};
    delete body.id;
    if (!body.createdAt) body.createdAt = body.updatedAt;
    if (this.db) {
      try { await this.db.collection(col).doc(id).set(body); }
      catch (e) { toast(e?.code === "invalid_argument" ? "บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูล" : e?.code === "quota_exceeded" ? "พื้นที่ฐานข้อมูลเต็ม ลบข้อมูลเก่าก่อน" : "บันทึกไม่สำเร็จ ลองอีกครั้ง", true); throw e; }
    } else {
      const arr = D[col]; const i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr[i] = {id, ...body}; else arr.push({id, ...body});
      this.persist(); render();
    }
    if (logText) this.log(logText, col, id);
    return id;
  },
  async remove(col, id, logText) {
    if (this.db) {
      try { await this.db.collection(col).doc(id).delete(); }
      catch (e) { toast("ลบไม่สำเร็จ ลองอีกครั้ง", true); throw e; }
    } else { D[col] = D[col].filter(x => x.id !== id); this.persist(); render(); }
    if (logText) this.log(logText, col, id);
  },
  async log(text, col, ref) {
    const body = {at:new Date().toISOString(), text, col:col||"", ref:ref||""};
    if (this.db) { try { await this.db.collection("activity").doc(newId()).set(body); } catch {} }
    else { D.activity.unshift({id:newId(), ...body}); D.activity = D.activity.slice(0,80); this.persist(); render(); }
  },
};

/* ================= finance helpers ================= */
const paidOf = inv => (inv.payments || []).reduce((a,p) => a + num(p.amount), 0);
const balOf = inv => Math.max(0, num(inv.amount) - paidOf(inv));
const invStatus = inv => { const p = paidOf(inv); if (num(inv.amount) > 0 && p >= num(inv.amount)) return "paid"; if (inv.dueDate && inv.dueDate < today()) return "overdue"; return p > 0 ? "partial" : "unpaid"; };
const invBadge = inv => { const s = INV_STATUS[invStatus(inv)]; return `<span class="badge ${s[2]}" title="${s[1]}">${s[0]}</span>`; };
function quoteTotals(q) {
  const sub = (q.items || []).reduce((a,it) => a + num(it.qty) * num(it.price), 0);
  const disc = Math.min(num(q.discount), sub); const base = sub - disc;
  const vat = q.vat ? base * 0.07 : 0; const total = base + vat; const wht = q.wht ? base * 0.03 : 0;
  return {sub, disc, base, vat, total, wht, net: total - wht};
}
function projFinance(pid) {
  const p = byId("projects", pid);
  const invs = D.invoices.filter(i => i.projectId === pid);
  const invoiced = invs.reduce((a,i) => a + num(i.amount), 0);
  const received = invs.reduce((a,i) => a + paidOf(i), 0);
  const exps = D.expenses.filter(e => e.projectId === pid);
  const costA = exps.filter(e => e.kind !== "estimated").reduce((a,e) => a + num(e.amount), 0);
  const costE = exps.filter(e => e.kind === "estimated").reduce((a,e) => a + num(e.amount), 0);
  const value = p && p.dealType !== "barter" ? num(p.value) : 0;
  const committed = p && (ACTIVE_P.has(p.status) || p.status === "completed");
  const uninvoiced = committed ? Math.max(0, value - invoiced) : 0;
  const expected = invs.reduce((a,i) => a + balOf(i), 0) + uninvoiced;
  return {invoiced, received, costA, costE, value, expected, gross: received - costA, barter: num(p?.barterValue)};
}
function matchFinFilter(rec, f) {
  const proj = byId("projects", rec.projectId);
  if (f.client && rec.clientId !== f.client && proj?.clientId !== f.client) return false;
  if (f.project && rec.projectId !== f.project) return false;
  if (f.page && rec.pageId !== f.page && !(proj?.pageIds || []).includes(f.page)) return false;
  return true;
}
const inRange = (d, f) => !!d && (!f.from || d >= f.from) && (!f.to || d <= f.to);

/* ================= content metrics ================= */
const engOf = c => num(c.likes) + num(c.comments) + num(c.shares) + num(c.saves);
const hasM = c => METRICS.some(([k]) => num(c[k]) > 0);
const pct = (a, b) => b > 0 ? (a / b * 100).toFixed(2) + "%" : "N/A";
const nfmt = n => Math.round(num(n)).toLocaleString("th-TH");
const nK = n => n >= 1e6 ? (n/1e6).toFixed(1) + "M" : n >= 1e4 ? (n/1e3).toFixed(1) + "K" : nfmt(n);
function sumM(list) {
  const o = {posts:list.length, measured:0, eng:0}; METRICS.forEach(([k]) => o[k] = 0);
  for (const c of list) { METRICS.forEach(([k]) => o[k] += num(c[k])); o.eng += engOf(c); if (hasM(c)) o.measured++; }
  return o;
}

function table(key, rows, cols, {onRow, empty, per=20} = {}) {

  ${nPages > 1 ? `<div class="pager"><span>${pg*per+1}–${Math.min(total,(pg+1)*per)} จาก ${total}</span><span class="b"><button class="btn sm" data-pg="${key}|${pg-1}" ${pg===0?"disabled":""}>ก่อนหน้า</button><button class="btn sm" data-pg="${key}|${pg+1}" ${pg>=nPages-1?"disabled":""}>ถัดไป</button></span></div>` : ""}`;

  }

  }

  const rank = {appt:0, publish:1, due:2, task:3};

}

function simpleBars(series, color, fmt, label, int) {
  const W = 560, H = 200, L = 46, B = 26, T = 10; const max = Math.max(1, ...series.map(s => s.v));
  const nice = int ? Math.max(4, Math.ceil(max/4)*4) : (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const y = v => T + (H-T-B) * (1 - v/nice); const bw = (W-L)/series.length; let g = "";
  for (let i=0;i<=4;i++){ const v = nice*i/4; g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  series.forEach((s,i) => { const x = L + i*bw + bw*0.25, w = bw*0.5; const [yy, mm] = s.m.split("-").map(Number);
    g += `<rect x="${x}" y="${y(s.v)}" width="${w}" height="${Math.max(0,H-B-y(s.v))}" rx="3" fill="${color}"><title>${MON[mm-1]} ${String(yy+543).slice(2)}: ${fmt(s.v)}</title></rect>`;
    g += `<text x="${L + i*bw + bw/2}" y="${H-8}" text-anchor="middle">${MON[mm-1]} ${String(yy+543).slice(2)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function vAnalytics() {

    return [...m.entries()].map(([k, list]) => ({k, label:labelFn(k), ...sumM(list)})).sort((a,b) => b.views - a.views); };
  const byPage = group(c => c.pageId, k => k ? pageName(k) : "ไม่ระบุเพจ"), byPlat = group(c => c.platform, k => k || "ไม่ระบุ");

  const top = pub.filter(hasM).sort((a,b) => num(b.views) - num(a.views)).slice(0, 10);

  const dls = D.deliverables.filter(d => inR(d.dueDate) && (!f.page || d.pageId === f.page)); const dlDone = dls.filter(d => DONE_D.has(d.status)).length;

    ${any ? `<button class="btn ghost sm" data-act="anaClear">ล้างตัวกรอง</button>` : ""}</div>
  <h2 style="margin:4px 0 0;font-size:1rem">คอนเทนต์</h2>

    <div class="kpi"><span class="l">วิวรวม</span><span class="v">${nfmt(tot.views)}</span><span class="h">เฉลี่ย ${perPost(tot)} วิว/โพสต์</span></div>

    ${byCat.length ? byCat.map(([c,v]) => `<div><div style="display:flex;justify-content:space-between;font-size:.86rem"><span>${esc(c)}</span><span class="num">${thb(v)}</span></div><div class="bar"><i style="width:${v/maxCat*100}%;background:var(--bad);opacity:.8"></i></div></div>`).join("") : `<span class="muted">ยังไม่มีค่าใช้จ่ายจริงในช่วงนี้</span>`}</div></section>`;
}
function barChart(series) {
  const W = 560, H = 220, L = 52, B = 26, T = 10; const max = Math.max(1, ...series.flatMap(s=>[s.inc,s.exp]));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const y = v => T + (H-T-B) * (1 - v/nice); const bw = (W-L)/series.length; let g = "";
  for (let i=0;i<=4;i++){ const v = nice*i/4; g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${thbK(v)}</text>`; }
  series.forEach((s,i) => { const x = L + i*bw + bw*0.18, w = bw*0.3; const [yy, mm] = s.m.split("-").map(Number);
    g += `<rect x="${x}" y="${y(s.inc)}" width="${w}" height="${Math.max(0,H-B-y(s.inc))}" rx="3" fill="var(--good)"><title>${MON[mm-1]} รับ ${thb(s.inc)}</title></rect>`;
    g += `<rect x="${x+w+2}" y="${y(s.exp)}" width="${w}" height="${Math.max(0,H-B-y(s.exp))}" rx="3" fill="var(--bad)" opacity=".85"><title>${MON[mm-1]} จ่าย ${thb(s.exp)}</title></rect>`;
    g += `<text x="${L + i*bw + bw/2}" y="${H-8}" text-anchor="middle">${MON[mm-1]} ${String(yy+543).slice(2)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟเงินเข้าและค่าใช้จ่ายรายเดือน">${g}</svg>`;
}

  const active = document.activeElement; const fid = active && active !== document.body && root.contains(active) ? active.id : null; let selr = null;
  try { selr = fid && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null; } catch {}
  const dt = S.detail; let inner;

/* ================= toast / modal ================= */
function toast(msg, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), err ? 4200 : 2400);
}
const layer = $("#layer");
function modal(title, body, {wide, foot} = {}) {
  layer.innerHTML = `<div class="scrim"><form class="modal ${wide?"wide":""}" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="iconbtn" data-close aria-label="ปิด">${ico("x")}</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot || ""}</div></form></div>`;
  const scrim = $(".scrim", layer), f = $("form", layer);
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) closeModal(); });
  $$("[data-close]", f).forEach(b => b.addEventListener("click", closeModal));
  const first = $(".modal-b input:not([type=hidden]):not([disabled]):not([type=checkbox]), .modal-b select, .modal-b textarea", f); setTimeout(() => first?.focus(), 30);
  return f;
}
function closeModal() { layer.innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") { const cb = $(".confirm-holder"); if (cb) cb.remove(); else if (layer.innerHTML) closeModal(); } });
const stdFoot = withDel => `${withDel ? `<button type="button" class="btn danger" data-del>${ico("trash")}ลบ</button>` : ""}<div class="r"><button type="button" class="btn" data-close>ยกเลิก</button><button type="submit" class="btn primary" data-submit>บันทึก</button></div>`;
function confirmBox(text, onYes, yesLabel="ลบ") {
  const holder = document.createElement("div"); holder.className = "confirm-holder";
  holder.innerHTML = `<div class="scrim" style="z-index:50;align-items:center"><div class="modal" role="alertdialog" aria-modal="true" style="max-width:420px;border-radius:16px"><div class="modal-b"><b style="font-size:1.02rem">ยืนยันการดำเนินการ</b><div>${text}</div></div><div class="modal-f"><div class="r"><button class="btn" data-no>ยกเลิก</button><button class="btn danger-solid" data-yes>${esc(yesLabel)}</button></div></div></div></div>`;
  document.body.appendChild(holder);
  $("[data-no]", holder).onclick = () => holder.remove();
  $("[data-yes]", holder).onclick = async () => { $("[data-yes]", holder).disabled = true; try { await onYes(); } catch {} holder.remove(); };
  $("[data-no]", holder).focus();
}
const field = (id, label, input, {req, full, hint} = {}) => `<div class="f ${full?"full":""}" data-field="${id}"><label for="${id}">${esc(label)}${req ? ' <span class="req">*</span>' : ""}</label>${input}${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
const inp = (id, v, attrs="") => `<input id="${id}" value="${esc(v ?? "")}" ${attrs}>`;
const ta = (id, v, ph="") => `<textarea id="${id}" placeholder="${esc(ph)}">${esc(v ?? "")}</textarea>`;
const sel = (id, list, v, blank) => `<select id="${id}">${opts(list, v, blank)}</select>`;
const val = (f, id) => ($("#"+id, f)?.value ?? "").trim();
function requireFields(f, ids) {
  let ok = true;
  $$(".f.err", f).forEach(x => { x.classList.remove("err"); $(".msg", x)?.remove(); });
  for (const id of ids) { if (!val(f, id)) { ok = false; const w = $(`[data-field="${id}"]`, f); if (w) { w.classList.add("err"); w.insertAdjacentHTML("beforeend", `<span class="msg">จำเป็นต้องกรอก</span>`); } } }
  if (!ok) { $(".f.err input,.f.err select", f)?.focus(); toast("กรอกช่องที่จำเป็นให้ครบ", true); }

function nextNo(prefix, col) {
  const y = new Date().getFullYear() + 543; const re = new RegExp(`^${prefix}-${y}-(\\d+)$`);
  const max = D[col].reduce((m,x) => { const r = re.exec(x.number||""); return r ? Math.max(m, +r[1]) : m; }, 0);
  return `${prefix}-${y}-${String(max+1).padStart(3,"0")}`;
}

async function saveFile(filename, data) {

  try { await store.dl.save({filename, data}); toast("บันทึกไฟล์แล้ว"); }
  catch (e) { if (e?.code !== "declined") toast(e?.code === "rate_limited" ? "มีหน้าต่างบันทึกไฟล์เปิดอยู่แล้ว" : "บันทึกไฟล์ไม่สำเร็จ", true); }
}
const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };

  const f = S.f.fin || {}; const stamp = today();
  if (what === "clients") return saveFile(`clients-${stamp}.csv`, toCsv(["ชื่อ","ประเภทธุรกิจ","ผู้ติดต่อ","ตำแหน่ง","อีเมล","โทร","ช่องทาง","สถานะ","จำนวนโปรเจกต์"], D.clients.map(c => [c.name,c.businessType,c.contactName,c.position,c.email,c.phone,c.channel,st(CLIENT_STATUS,c.status)[2],D.projects.filter(p=>p.clientId===c.id).length])));
  if (what === "quotes") return saveFile(`quotations-${stamp}.csv`, toCsv(["เลขที่","วันที่","ลูกค้า","โปรเจกต์","ก่อน VAT","VAT","ยอดรวม","สถานะ"], D.quotations.filter(q => matchFinFilter(q,f) && (!f.from && !f.to || inRange(q.issueDate,f))).map(q => { const t = quoteTotals(q); return [q.number,q.issueDate,clientName(q.clientId),q.projectId?projName(q.projectId):"",t.base.toFixed(2),t.vat.toFixed(2),t.total.toFixed(2),st(QUOTE_STATUS,q.status)[2]]; })));
  if (what === "invoices") return saveFile(`invoices-${stamp}.csv`, toCsv(["เลขที่","วันที่ออก","ครบกำหนด","ลูกค้า","โปรเจกต์","ยอดเรียกเก็บ","ชำระแล้ว","คงค้าง","สถานะ"], D.invoices.filter(i => matchFinFilter(i,f)).map(i => [i.number,i.issueDate,i.dueDate,clientName(i.clientId),i.projectId?projName(i.projectId):"",num(i.amount),paidOf(i),balOf(i),INV_STATUS[invStatus(i)][1]])));
  if (what === "payments") return saveFile(`payments-${stamp}.csv`, toCsv(["วันที่รับ","จำนวน","มัดจำ","ใบแจ้งหนี้","ลูกค้า","โปรเจกต์","หมายเหตุ"], D.invoices.filter(i => matchFinFilter(i,f)).flatMap(i => (i.payments||[]).filter(p => (!f.from && !f.to) || inRange(p.date,f)).map(p => [p.date,num(p.amount),p.deposit?"ใช่":"",i.number,clientName(i.clientId),i.projectId?projName(i.projectId):"",p.note]))));
  const cRow = c => [c.publishDate, c.title, pageName(c.pageId), c.platform, c.format, c.kind==="sponsored"?"งานลูกค้า":"ของเพจ", c.projectId?projName(c.projectId):"", st(CONTENT_STATUS,c.status)[1], ...METRICS.map(([k]) => c[k] === "" || c[k] === undefined ? "" : num(c[k])), num(c.reach) ? (engOf(c)/num(c.reach)*100).toFixed(2) : "N/A", c.metricsAt, c.postUrl, c.location, c.tags];
  const cHead = ["วันโพสต์","ชื่อ","เพจ","แพลตฟอร์ม","รูปแบบ","ประเภท","โปรเจกต์","สถานะ", ...METRICS.map(m => m[1]), "ER (%)","ตัวเลข ณ วันที่","ลิงก์","สถานที่","แท็ก"];
  if (what === "content") return saveFile(`content-${stamp}.csv`, toCsv(cHead, D.content.map(cRow)));
  if (what === "analytics") { const a = S.f.ana || {}; return saveFile(`content-results-${stamp}.csv`, toCsv(cHead, D.content.filter(c => c.status === "published" && c.publishDate && (!a.from || c.publishDate >= a.from) && (!a.to || c.publishDate <= a.to) && (!a.page || c.pageId === a.page) && (!a.platform || c.platform === a.platform)).map(cRow))); }
  if (what === "expenses") return saveFile(`expenses-${stamp}.csv`, toCsv(["วันที่","หมวด","จ่ายให้","จำนวน","ประเภท","โปรเจกต์","เพจ","หมายเหตุ"], D.expenses.filter(e => matchFinFilter(e,f) && ((!f.from && !f.to) || inRange(e.date,f))).map(e => [e.date,e.category,e.vendor,num(e.amount),e.kind==="estimated"?"ประมาณการ":"จ่ายจริง",e.projectId?projName(e.projectId):"",e.pageId?pageName(e.pageId):"",e.notes])));
}

/* ================= events ================= */
const ACT = {
  newContent: el => contentForm(null, {...(el.dataset.status ? {status:el.dataset.status} : {}), ...(el.dataset.project ? {projectId:el.dataset.project} : {})}),
  campaignReport: el => campaignReport(el.dataset.id),
  anaRange(el) { const n = +el.dataset.days; S.f.ana = {...(S.f.ana||{}), from:addDays(today(), -n + 1), to:today()}; render(); },
  anaClear() { S.f.ana = {}; render(); },
  newEvent: el => eventForm(null, el.dataset.d),
  schedView(el) { S.sched.view = el.dataset.v; try { localStorage.setItem("schedView", S.sched.view); } catch {} render(); },
  schedMove(el) { const n = +el.dataset.n; const v = S.sched.view; if (v === "month") { const d = parseD(S.sched.date); S.sched.date = iso(new Date(d.getFullYear(), d.getMonth()+n, 1)); } else S.sched.date = addDays(S.sched.date, n * (v === "week" ? 7 : 1)); render(); },
  schedToday() { S.sched.date = today(); render(); },
  pickDay(el) { S.sched.date = el.dataset.d; if (el.dataset.view) S.sched.view = el.dataset.view; render(); },
  drawer() { const h = document.createElement("div"); h.className = "drawer"; h.innerHTML = `<div class="in">${NAV.map(n => `<button class="nav-item" data-go="${n.id}" ${S.route===n.id?'aria-current="page"':""}>${ico(n.icon)}${n.label}</button>`).join("")}${SOON.map(n => `<div class="nav-soon">${ico(n.icon)}${n.label}<em>เร็ว ๆ นี้</em></div>`).join("")}</div>`; h.addEventListener("click", e => { if (e.target === h || e.target.closest("[data-go]")) setTimeout(() => h.remove()); }); document.body.appendChild(h); },
  newClient: () => clientForm(null), editClient: el => clientForm(byId("clients", el.dataset.id)), delClient: el => delClient(el.dataset.id),
  newProject: el => projectForm(null, el.dataset.client ? {clientId:el.dataset.client} : {}), editProject: el => projectForm(byId("projects", el.dataset.id)), delProject: el => delProject(el.dataset.id),
  newDeliv: el => delivForm(null, el.dataset.project || ""), newTask: el => taskForm(null, el.dataset.project || ""),
  newQuote: el => quoteForm(null, el.dataset.project ? {projectId:el.dataset.project} : {}), newInvoice: el => invoiceForm(null, el.dataset.project ? {projectId:el.dataset.project} : {}), newExpense: el => expenseForm(null, el.dataset.project ? {projectId:el.dataset.project} : {}),
  async toggleTask(el) { const t = byId("tasks", el.dataset.id); if (!t) return; const done = t.status !== "done"; el.classList.toggle("on", done);
    try { await store.save("tasks", t.id, {...t, status: done ? "done" : "todo"}, (done ? "ทำงานเสร็จ: " : "เปิดงานอีกครั้ง: ") + t.title); toast(done ? "งานเสร็จแล้ว" : "ย้ายกลับไปเป็นงานที่ต้องทำ"); } catch { el.classList.toggle("on", !done); } },
  projView(el) { S.projView = el.dataset.v; try { localStorage.setItem("projView", S.projView); } catch {} render(); },
  calPrev() { let [y,m] = S.calYm; m--; if (m<0){m=11;y--;} S.calYm=[y,m]; render(); }, calNext() { let [y,m] = S.calYm; m++; if (m>11){m=0;y++;} S.calYm=[y,m]; render(); },
  calToday() { S.calYm = [new Date().getFullYear(), new Date().getMonth()]; render(); },
  goCal() { go("schedule"); }, goQuotes() { S.finTab = "quotes"; go("finance"); },
  goWaiting() { S.f.cli = {...(S.f.cli||{}), status:"_waiting"}; go("clients"); },
  clearFin() { S.f.fin = {}; render(); },
  rangeM() { const n = new Date(); S.f.fin = {...(S.f.fin||{}), from:iso(new Date(n.getFullYear(), n.getMonth(), 1)), to:iso(new Date(n.getFullYear(), n.getMonth()+1, 0))}; render(); },
  rangeY() { const y = new Date().getFullYear(); S.f.fin = {...(S.f.fin||{}), from:`${y}-01-01`, to:`${y}-12-31`}; render(); },
  csv: el => exportCsv(el.dataset.what),
  backup() { saveFile(`creator-backup-${today()}.json`, JSON.stringify({exportedAt:new Date().toISOString(), schema:"creator-desk/v1", data:Object.fromEntries(COLS.map(c => [c, D[c]]))}, null, 2)); },
  addPage: () => pageForm(null), editPage: el => pageForm(pageOf(el.dataset.id)),
  async listDel(el) { const key = el.dataset.key; const list = [...settings()[key]]; const [x] = list.splice(+el.dataset.i, 1); try { await saveSettings({[key]:list}, `ลบ “${x}” ออกจากการตั้งค่า`); toast("ลบแล้ว"); } catch {} },
  delLog(el) { const c = byId("clients", el.dataset.id); const i = +el.dataset.i; confirmBox("ลบบันทึกการติดต่อนี้?", async () => { await store.save("clients", c.id, {...c, log:(c.log||[]).filter((_,k)=>k!==i)}); toast("ลบแล้ว"); }); },
  clearSample() { const n = sampleCount();
    confirmBox(`ลบข้อมูลตัวอย่างทั้งหมด ${n} รายการ? ข้อมูลที่คุณเพิ่มเองจะไม่ถูกลบ`, async () => { for (const c of DATA_COLS) for (const x of D[c].filter(x=>x.sample)) await store.remove(c, x.id); await store.log("ล้างข้อมูลตัวอย่าง"); toast("ล้างข้อมูลตัวอย่างแล้ว"); }, "ล้างข้อมูล"); },
};
const OPEN = {
  content: id => { const c = byId("content", id); c ? contentForm(c) : toast("ไม่พบรายการนี้", true); },
  event: id => { const e = byId("events", id); e ? eventForm(e) : toast("ไม่พบรายการนี้", true); },
  project: id => openDetail("project", id), client: id => openDetail("client", id),
  deliv: id => { const d = byId("deliverables", id); d ? delivForm(d) : toast("ไม่พบรายการนี้", true); }, task: id => { const t = byId("tasks", id); t ? taskForm(t) : toast("ไม่พบรายการนี้", true); },
  quote: id => { const q = byId("quotations", id); q ? quoteForm(q) : toast("ไม่พบรายการนี้", true); }, invoice: id => { const i = byId("invoices", id); i ? invoiceForm(i) : toast("ไม่พบรายการนี้", true); }, expense: id => { const e = byId("expenses", id); e ? expenseForm(e) : toast("ไม่พบรายการนี้", true); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-act],[data-open],[data-sort],[data-pg],[data-tab],[data-fset]");
  if (!el || el.closest("#layer") || el.closest(".confirm-holder")) return;
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.act && ACT[el.dataset.act]) { e.preventDefault(); return ACT[el.dataset.act](el); }
  if (el.dataset.open) { const [t, id] = el.dataset.open.split("|"); if (id && OPEN[t]) OPEN[t](id); return; }
  if (el.dataset.sort) { const [k, c] = el.dataset.sort.split("|"); const cur = S.sort[k]; S.sort[k] = {k:c, dir: cur?.k === c && cur.dir === "asc" ? "desc" : "asc"}; render(); return; }
  if (el.dataset.pg) { const [k, n] = el.dataset.pg.split("|"); S.pg[k] = +n; render(); return; }
  if (el.dataset.tab) { const [k, v] = el.dataset.tab.split("|"); S[k] = v; render(); return; }
  if (el.dataset.fset) { const [k, fl, v] = el.dataset.fset.split("|"); S.f[k] = {...(S.f[k]||{}), [fl]:v}; S.pg[k] = 0; render(); return; }
});
document.addEventListener("input", e => { const k = e.target.dataset?.q; if (k !== undefined && !e.target.closest("#layer")) { S.q[k] = e.target.value; S.pg[k] = 0; render(); } });
document.addEventListener("change", async e => {
  const t = e.target; if (t.closest("#layer")) return;
  if (t.dataset.f) { const [k, fl] = t.dataset.f.split("|"); S.f[k] = {...(S.f[k]||{}), [fl]:t.value}; S.pg[k] = 0; render(); return; }
  if (t.dataset.actChange === "projStatus") { const p = byId("projects", t.dataset.id); try { await store.save("projects", p.id, {...p, status:t.value}, `เปลี่ยนสถานะ ${p.name}: ${st(PROJECT_STATUS,p.status)[1]} → ${st(PROJECT_STATUS,t.value)[1]}`); toast("อัปเดตสถานะแล้ว"); } catch { t.value = p.status; } }
  if (t.dataset.actChange === "clientStatus") { const c = byId("clients", t.dataset.id); try { await store.save("clients", c.id, {...c, status:t.value}, `เปลี่ยนสถานะลูกค้า ${c.name}: ${st(CLIENT_STATUS,c.status)[1]} → ${st(CLIENT_STATUS,t.value)[1]}`); toast("อัปเดตสถานะแล้ว"); } catch { t.value = c.status; } }
});
document.addEventListener("submit", async e => {
  const f = e.target; if (f.closest("#layer")) return; e.preventDefault();
  if (f.id === "logForm") { const c = byId("clients", f.dataset.id); const text = $("#log-text", f).value.trim(); if (!text) { toast("พิมพ์สรุปการคุยก่อน", true); $("#log-text",f).focus(); return; }
    try { await store.save("clients", c.id, {...c, log:[...(c.log||[]), {date:$("#log-date",f).value || today(), channel:$("#log-ch",f).value, text}]}, `บันทึกการติดต่อ ${c.name}: ${text}`); toast("บันทึกแล้ว"); } catch {} }
  if (f.id === "bizForm") { const name = $("#s-biz", f).value.trim(); if (!name) { toast("ใส่ชื่อธุรกิจ", true); return; }
    try { await saveSettings({businessName:name, taxInfo:$("#s-tax",f).value.trim(), vatRegistered:$("#s-vat",f).checked}, "แก้ไขข้อมูลธุรกิจ"); toast("บันทึกข้อมูลธุรกิจแล้ว"); } catch {} }
  if (f.dataset.listadd) { const key = f.dataset.listadd; const v = $("input", f).value.trim(); if (!v) return;
    const list = settings()[key]; if (list.includes(v)) { toast("มีรายการนี้อยู่แล้ว", true); return; }
    try { await saveSettings({[key]:[...list, v]}, `เพิ่ม “${v}” ในการตั้งค่า`); toast("เพิ่มแล้ว"); } catch {} }
});
// kanban drag & drop
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-drag]"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.drag); e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", e => { const col = e.target.closest?.("[data-drop]"); if (col) { e.preventDefault(); $$(".kcol.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("dragleave", e => { const col = e.target.closest?.("[data-drop]"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", async e => { const col = e.target.closest?.("[data-drop]"); if (!col) return; e.preventDefault(); col.classList.remove("over");
  const raw = e.dataTransfer.getData("text/plain"); const s = col.dataset.drop;
  if (raw.startsWith("content:") || col.dataset.dropcol === "content") {
    const c = raw.startsWith("content:") && byId("content", raw.slice(8)); if (!c || col.dataset.dropcol !== "content" || c.status === s) return;
    const patch = {...c, status:s}; if (s === "published" && !c.publishDate) patch.publishDate = today();
    try { await store.save("content", c.id, patch, `ย้ายคอนเทนต์ ${c.title}: ${st(CONTENT_STATUS,c.status)[1]} → ${st(CONTENT_STATUS,s)[1]}`); toast("ย้ายไป " + st(CONTENT_STATUS,s)[1]); } catch {}
    return; }
  const p = byId("projects", raw); if (!p || p.status === s || !PROJECT_STATUS.some(x => x[0] === s)) return;
  try { await store.save("projects", p.id, {...p, status:s}, `ย้าย ${p.name}: ${st(PROJECT_STATUS,p.status)[1]} → ${st(PROJECT_STATUS,s)[1]}`); toast("ย้ายไป " + st(PROJECT_STATUS,s)[1]); } catch {} });

/* ================= boot ================= */
const h = (location.hash || "").slice(1); if (NAV.some(n => n.id === h)) S.route = h;
render();
store.init();
})();
</script>
